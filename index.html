<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NZ Traffic Dashboard</title>
  <!-- A tiny LED message sign. SVG for current browsers, PNG for older ones and iOS home screens -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Added to a phone's home screen, it opens as an app (the icons are the sign on a dark square,
       small enough within it for Android to crop to any shape). The browser's bar takes the
       header's colour (set to the theme's by App) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="apple-mobile-web-app-title" content="NZ Traffic">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
